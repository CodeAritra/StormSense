services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_BACKEND=onnx
      - REPLAY_TICK_SECONDS=2.0
      - API_PORT=8000
    volumes:
      - ./models:/app/models
      - ./apps/api/data:/app/apps/api/data
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
